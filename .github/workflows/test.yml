name: test
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Install apps/ui deps (landing site)
        run: npm --prefix apps/ui ci --no-audit --no-fund
      - name: Copy .env.dev.ci into place for the API server
        # .env.dev.ci ships with the repo and only contains placeholder
        # values — sufficient for /config to respond and for the OAuth
        # routes to 4xx without a real `code` param.
        run: cp .env.dev.ci .env.dev
      - run: npx playwright install --with-deps chromium
      - name: Start API server (port 3000)
        run: npm run start:dev:server &
      - name: Start landing site (port 27100)
        run: npm run ui:dev &
      - name: Wait for ports 3000 + 27100
        run: |
          ok3000=0
          ok27100=0
          for i in $(seq 1 90); do
            if [ $ok3000 -eq 0 ] && curl -sf http://localhost:3000/config > /dev/null; then ok3000=1; fi
            if [ $ok27100 -eq 0 ] && curl -sf http://localhost:27100/welcome/ > /dev/null; then ok27100=1; fi
            if [ $ok3000 -eq 1 ] && [ $ok27100 -eq 1 ]; then
              echo "Both services up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for servers (api=$ok3000 ui=$ok27100)"
          exit 1
      - run: E2E=1 npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/tests-e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # NOTE: e2e-extension is intentionally NOT wired into CI yet. The
  # in-extension Playwright project runs green locally on macOS but hits
  # ERR_BLOCKED_BY_CLIENT on GitHub Actions Ubuntu runners even under
  # Chrome for Testing + xvfb + --no-sandbox. The specs live in
  # packages/tests-e2e/tests/extension/ for local dev use (run with
  # `EXT_E2E=1 npm run test:e2e:ext`). Re-enable this job once the
  # Linux/CI flag mix is sorted out.
