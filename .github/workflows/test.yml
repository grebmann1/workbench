name: test
# Required status checks on master: unit, build, e2e-smoke, e2e-extension.
on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
jobs:
    unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.14'
                  cache: 'npm'
            - run: npm ci --no-audit --no-fund
            - run: npm --prefix packages/desktop ci --no-audit --no-fund
            - run: npm run lint
            - run: npm test
            - run: npm --prefix packages/desktop run test

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.14'
                  cache: 'npm'
            - run: npm ci --no-audit --no-fund
            - run: npm --prefix packages/desktop ci --no-audit --no-fund
            - name: Install apps/ui + apps/docs deps
              run: |
                  npm --prefix apps/ui ci --no-audit --no-fund
                  npm --prefix apps/docs ci --no-audit --no-fund
            - run: npm run build:shared
            - run: npm run build:workers
            - run: npm run build:extension:main
            - run: npm run build:server
            - run: npm run site:build
            - run: npm run build:desktop

    e2e-smoke:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.14'
                  cache: 'npm'
            - run: npm ci --no-audit --no-fund
            - name: Install apps/ui deps (landing site)
              run: npm --prefix apps/ui ci --no-audit --no-fund
            - name: Copy .env.dev.ci into place for the API server
              # .env.dev.ci ships with the repo and only contains placeholder
              # values — sufficient for /config to respond and for the OAuth
              # routes to 4xx without a real `code` param.
              run: cp .env.dev.ci .env.dev
            - run: npx playwright install --with-deps chromium
            - name: Start API server (port 3000)
              run: npm run start:dev:server &
            - name: Start landing site (port 27100)
              run: npm run ui:dev &
            - name: Wait for ports 3000 + 27100
              run: |
                  ok3000=0
                  ok27100=0
                  for i in $(seq 1 90); do
                    if [ $ok3000 -eq 0 ] && curl -sf http://localhost:3000/config > /dev/null; then ok3000=1; fi
                    if [ $ok27100 -eq 0 ] && curl -sf http://localhost:27100/welcome/ > /dev/null; then ok27100=1; fi
                    if [ $ok3000 -eq 1 ] && [ $ok27100 -eq 1 ]; then
                      echo "Both services up after ${i}s"
                      exit 0
                    fi
                    sleep 1
                  done
                  echo "Timed out waiting for servers (api=$ok3000 ui=$ok27100)"
                  exit 1
            - run: E2E=1 npm run test:e2e:smoke
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: packages/tests-e2e/playwright-report
                  if-no-files-found: ignore
                  retention-days: 7

    e2e-extension:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.14'
                  cache: 'npm'
            - run: npm ci --no-audit --no-fund
            - name: Build extension
              run: npm run build:extension:main
            - name: Install Playwright bundled Chromium
              # Use Playwright's bundled Chromium (not Chrome for Testing).
              # Chrome 137+ removed --load-extension from branded builds, which
              # is why we can't use channel: 'chrome' for MV3 extension tests.
              run: npx playwright install --with-deps chromium
            - name: Run extension specs under xvfb
              # MV3 extensions require headed mode. xvfb provides a virtual
              # display on the headless Ubuntu runner.
              run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run test:e2e:ext
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-ext-report
                  path: packages/tests-e2e/playwright-report
                  if-no-files-found: ignore
                  retention-days: 7
