name: extension-release

on:
    workflow_dispatch:
    push:
        tags:
            - 'extension-v*'
        branches:
            # Pushing to a release-candidate branch auto-builds the extension zip as a
            # workflow artifact for testing. The Chrome Web Store upload stays gated on an
            # `extension-v*` tag (see the upload step's `if:`), so RC pushes never publish.
            - 'release-candidate/**'

permissions:
    contents: write

jobs:
    publish:
        name: build & publish chrome extension (draft)
        runs-on: ubuntu-latest
        timeout-minutes: 30

        env:
            WORKBENCH_VSCODE_URL: ${{ secrets.WORKBENCH_VSCODE_URL }}
            WORKBENCH_BASE_URL: ${{ secrets.WORKBENCH_BASE_URL }}
            GOOGLE_CLIENT_ID_EXTENSION: ${{ secrets.GOOGLE_CLIENT_ID_EXTENSION }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.14'
                  cache: 'npm'

            - name: Read version from package.json
              id: version
              run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Verify tag matches package.json version
              if: startsWith(github.ref, 'refs/tags/extension-v')
              env:
                  REF_NAME: ${{ github.ref_name }}
                  PKG_VERSION: ${{ steps.version.outputs.value }}
              run: |
                  TAG_VERSION="${REF_NAME#extension-v}"
                  if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                      echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build extension (production)
              run: npm run build:prod:extension

            - name: Package extension zip
              env:
                  PKG_VERSION: ${{ steps.version.outputs.value }}
              run: |
                  cd dist/extension
                  zip -r "../../workbench-extension-${PKG_VERSION}.zip" .

            - name: Upload extension zip artifact
              uses: actions/upload-artifact@v4
              with:
                  name: workbench-extension-${{ steps.version.outputs.value }}
                  path: workbench-extension-${{ steps.version.outputs.value }}.zip
                  if-no-files-found: error
                  retention-days: 30

            - name: Upload to Chrome Web Store (draft, no publish)
              if: startsWith(github.ref, 'refs/tags/extension-v')
              uses: mnao305/chrome-extension-upload@v5.0.0
              with:
                  file-path: workbench-extension-${{ steps.version.outputs.value }}.zip
                  extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
                  client-id: ${{ secrets.CHROME_CLIENT_ID }}
                  client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
                  refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
                  publish: false
