name: desktop-release

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write

jobs:
    make:
        name: make desktop (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest, ubuntu-latest]

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
            APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
            DESKTOP_WINDOWS_ICON: ${{ secrets.DESKTOP_WINDOWS_ICON }}
            DESKTOP_LINUX_ICON: ${{ secrets.DESKTOP_LINUX_ICON }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.14'
                  cache: 'npm'

            - name: Install Linux maker prerequisites
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

            - name: Install root dependencies
              run: npm ci --no-audit --no-fund

            - name: Install desktop dependencies
              run: npm --prefix packages/desktop ci --no-audit --no-fund

            - name: Make desktop artifacts
              run: npm --prefix packages/desktop run make

            - name: Normalize macOS DevBar ZIP asset
              if: runner.os == 'macOS'
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p packages/desktop/out/make/devbar
                  app_path="$(ls -d packages/desktop/out/*-darwin-*/Workbench\ Desktop.app | head -n 1)"
                  if [ -z "$app_path" ]; then
                    echo "No packaged Workbench Desktop.app found under packages/desktop/out"
                    exit 1
                  fi
                  ditto -c -k --sequesterRsrc --keepParent "$app_path" "packages/desktop/out/make/devbar/workbench-desktop-darwin-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}-latest.zip"

            - name: Publish desktop artifacts
              if: startsWith(github.ref, 'refs/tags/v')
              run: npm --prefix packages/desktop exec -- electron-forge publish

            - name: Publish macOS DevBar ZIP alias
              if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "${GITHUB_REF_NAME}" packages/desktop/out/make/devbar/*.zip --clobber

            - name: Upload desktop artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-${{ runner.os }}-${{ runner.arch }}
                  path: packages/desktop/out/make/**
                  if-no-files-found: error
                  retention-days: 14
