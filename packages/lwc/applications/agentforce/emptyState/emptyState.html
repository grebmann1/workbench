<template>
    <div class="agentforce-empty-state slds-text-align_center slds-p-around_medium">
        <div class="agentforce-empty-state__illustration">
            <lightning-icon
                icon-name={iconName}
                size="large"
                alternative-text={title}></lightning-icon>
        </div>
        <h3 class="agentforce-empty-state__title slds-text-heading_small slds-p-top_small">
            {title}
        </h3>
        <p
            class="agentforce-empty-state__message slds-text-body_regular slds-text-color_weak slds-p-top_x-small">
            {message}
        </p>
        <div class="agentforce-empty-state__actions slds-p-top_small">
            <template lwc:if={hasCta}>
                <button type="button" class="slds-button slds-button_brand" onclick={handleCta}>
                    {ctaLabel}
                </button>
            </template>
            <template lwc:if={canRetry}>
                <button type="button" class="slds-button slds-button_neutral" onclick={handleRetry}>
                    Retry
                </button>
            </template>
        </div>
    </div>
</template>
