<template>
    <div class="inspector-container slds-full-height slds-flex-column">
        <template lwc:if={loading}>
            <agentforce-tree-skeleton></agentforce-tree-skeleton>
        </template>
        <template lwc:elseif={hasError}>
            <agentforce-empty-state
                kind="inspector"
                state={errorVariant}
                error-message={error}
                onretry={handleRefresh}></agentforce-empty-state>
        </template>
        <template lwc:elseif={isEmpty}>
            <agentforce-empty-state kind="inspector" state="no-data"></agentforce-empty-state>
        </template>
        <template lwc:else>
            <div class="agentforce-inspector__search">
                <input
                    type="text"
                    class="agentforce-inspector__search-input"
                    placeholder="Search agents, topics, actions…"
                    value={searchQuery}
                    oninput={handleSearchInput}
                    aria-label="Search agents, topics, actions" />
                <template lwc:if={hasSearchQuery}>
                    <button
                        class="agentforce-inspector__search-clear"
                        type="button"
                        onclick={handleSearchClear}
                        aria-label="Clear search">
                        ×
                    </button>
                </template>
                <button
                    class="agentforce-inspector__refresh"
                    type="button"
                    onclick={handleRefresh}
                    disabled={loading}
                    title="Refresh agents"
                    aria-label="Refresh agents">
                    <lightning-icon
                        icon-name="utility:refresh"
                        size="xx-small"
                        alternative-text="Refresh"></lightning-icon>
                </button>
            </div>
            <template lwc:if={hasAgents}>
                <div class="tree-section-header">Agents</div>
                <ul class="slds-tree slds-scrollable_y" role="tree" aria-label="Agent hierarchy">
                    <template for:each={treeData} for:item="agent">
                        <li
                            key={agent.id}
                            class="tree-item level-0"
                            role="treeitem"
                            aria-expanded={agent.isExpanded}>
                            <div
                                class={agent.nodeClass}
                                data-id={agent.id}
                                onclick={handleAgentClick}>
                                <span class="tree-toggle">
                                    <template lwc:if={agent.isExpanded}>
                                        <span class="toggle-icon expanded">&#9660;</span>
                                    </template>
                                    <template lwc:else>
                                        <span class="toggle-icon">&#9654;</span>
                                    </template>
                                </span>
                                <span class="node-icon agent-icon"></span>
                                <span class="node-label">
                                    <template lwc:if={agent.labelSegments}>
                                        <template
                                            for:each={agent.labelSegments}
                                            for:item="seg"
                                            for:index="i">
                                            <template lwc:if={seg.isMatch}>
                                                <mark
                                                    key={seg.key}
                                                    class="agentforce-inspector__highlight">
                                                    {seg.text}
                                                </mark>
                                            </template>
                                            <template lwc:else>
                                                <span key={seg.key}>{seg.text}</span>
                                            </template>
                                        </template>
                                    </template>
                                    <template lwc:else>{agent.label}</template>
                                </span>
                            </div>
                            <template lwc:if={agent.isExpanded}>
                                <ul class="slds-tree__group" role="group">
                                    <template for:each={agent.children} for:item="topic">
                                        <li
                                            key={topic.id}
                                            class="tree-item level-1"
                                            role="treeitem"
                                            aria-expanded={topic.isExpanded}>
                                            <div
                                                class={topic.nodeClass}
                                                data-id={topic.id}
                                                onclick={handleTopicClick}>
                                                <span class="tree-toggle">
                                                    <template lwc:if={topic.hasChildren}>
                                                        <template lwc:if={topic.isExpanded}>
                                                            <span class="toggle-icon expanded">
                                                                &#9660;
                                                            </span>
                                                        </template>
                                                        <template lwc:else>
                                                            <span class="toggle-icon">&#9654;</span>
                                                        </template>
                                                    </template>
                                                </span>
                                                <span class="node-icon topic-icon"></span>
                                                <span class="node-label">
                                                    <template lwc:if={topic.labelSegments}>
                                                        <template
                                                            for:each={topic.labelSegments}
                                                            for:item="seg"
                                                            for:index="i">
                                                            <template lwc:if={seg.isMatch}>
                                                                <mark
                                                                    key={seg.key}
                                                                    class="agentforce-inspector__highlight">
                                                                    {seg.text}
                                                                </mark>
                                                            </template>
                                                            <template lwc:else>
                                                                <span key={seg.key}>
                                                                    {seg.text}
                                                                </span>
                                                            </template>
                                                        </template>
                                                    </template>
                                                    <template lwc:else>{topic.label}</template>
                                                </span>
                                            </div>
                                            <template lwc:if={topic.isExpanded}>
                                                <ul class="slds-tree__group" role="group">
                                                    <template
                                                        for:each={topic.children}
                                                        for:item="action">
                                                        <li
                                                            key={action.id}
                                                            class="tree-item level-2"
                                                            role="treeitem">
                                                            <div
                                                                class={action.nodeClass}
                                                                data-id={action.id}
                                                                onclick={handleActionClick}>
                                                                <span
                                                                    class="tree-toggle leaf-spacer"></span>
                                                                <span
                                                                    class="node-icon action-icon"></span>
                                                                <span class="node-label">
                                                                    <template
                                                                        lwc:if={action.labelSegments}>
                                                                        <template
                                                                            for:each={action.labelSegments}
                                                                            for:item="seg"
                                                                            for:index="i">
                                                                            <template
                                                                                lwc:if={seg.isMatch}>
                                                                                <mark
                                                                                    key={seg.key}
                                                                                    class="agentforce-inspector__highlight">
                                                                                    {seg.text}
                                                                                </mark>
                                                                            </template>
                                                                            <template lwc:else>
                                                                                <span key={seg.key}>
                                                                                    {seg.text}
                                                                                </span>
                                                                            </template>
                                                                        </template>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        {action.label}
                                                                    </template>
                                                                </span>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                        </li>
                    </template>
                </ul>
                <template lwc:if={hasTruncatedResults}>
                    <div class="agentforce-inspector__truncated" aria-live="polite">
                        +{truncatedExtraCount} more — refine your search
                    </div>
                </template>
            </template>
            <template lwc:if={hasAgentScripts}>
                <div class="tree-section-header">Agent Scripts</div>
                <ul class="slds-tree slds-scrollable_y" role="tree" aria-label="Agent Scripts">
                    <template for:each={scriptTreeData} for:item="script">
                        <li key={script.fullName} class="tree-item level-0" role="treeitem">
                            <div
                                class={script.nodeClass}
                                data-id={script.fullName}
                                onclick={handleScriptClick}>
                                <span class="tree-toggle leaf-spacer"></span>
                                <lightning-icon
                                    class="node-icon script-icon"
                                    icon-name="utility:einstein"
                                    size="xx-small"></lightning-icon>
                                <span class="node-label">{script.label}</span>
                                <span class="node-meta">{script.lastModified}</span>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
        </template>
    </div>
</template>
