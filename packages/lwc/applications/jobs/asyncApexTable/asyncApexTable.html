<template>
    <template lwc:if={isLoading}>
        <div class="slds-p-around_large slds-align_absolute-center">
            <lightning-spinner
                alternative-text="Loading async Apex jobs"
                size="small"></lightning-spinner>
        </div>
    </template>
    <template lwc:elseif={isEmpty}>
        <div class="slds-p-around_large slds-text-align_center slds-text-color_weak">
            No recent async Apex jobs.
        </div>
    </template>
    <template lwc:else>
        <div class="jobs-table-wrap">
            <table
                class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">
                            <div class="slds-truncate" title="Apex Class">Apex Class</div>
                        </th>
                        <th scope="col"><div class="slds-truncate" title="Method">Method</div></th>
                        <th scope="col">
                            <div class="slds-truncate" title="Job Type">Job Type</div>
                        </th>
                        <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                        <th scope="col">
                            <div class="slds-truncate" title="Processed">Processed</div>
                        </th>
                        <th scope="col"><div class="slds-truncate" title="Errors">Errors</div></th>
                        <th scope="col">
                            <div class="slds-truncate" title="Created">Created</div>
                        </th>
                        <th scope="col"><span class="slds-assistive-text">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={renderedRows} for:item="row">
                        <tr key={row.id} class="slds-hint-parent">
                            <td>
                                <div class="slds-truncate" title={row.className}>
                                    {row.className}
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate" title={row.methodName}>
                                    {row.methodName}
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate" title={row.jobType}>{row.jobType}</div>
                            </td>
                            <td><span class={row.statusClass}>{row.status}</span></td>
                            <td>{row.progress}</td>
                            <td>{row.numberOfErrors}</td>
                            <td>
                                <div class="slds-truncate" title={row.createdDate}>
                                    {row.createdDate}
                                </div>
                            </td>
                            <td>
                                <lightning-button
                                    variant="neutral"
                                    label="Drilldown"
                                    data-id={row.id}
                                    disabled={row.isDrilldownDisabled}
                                    onclick={handleSelect}></lightning-button>
                            </td>
                        </tr>
                    </template>
                    <template lwc:if={hasMoreRows}>
                        <tr class="slds-hint-parent">
                            <td colspan="8">
                                <div
                                    class="slds-p-around_x-small slds-align_absolute-center slds-gutters_x-small">
                                    <span
                                        class="slds-text-body_small slds-text-color_weak slds-m-right_small">
                                        Showing {renderedRowCount} of {visibleRowCount} matching
                                        jobs.
                                    </span>
                                    <lightning-button
                                        variant="neutral"
                                        label="Show more"
                                        onclick={handleShowMore}></lightning-button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <template lwc:if={hasMore}>
            <div class="slds-p-around_small slds-text-align_center">
                <lightning-button
                    variant="neutral"
                    label="Load more"
                    onclick={handleLoadMore}></lightning-button>
            </div>
        </template>
    </template>
</template>
