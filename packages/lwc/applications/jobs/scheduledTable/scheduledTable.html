<template>
    <template lwc:if={isLoading}>
        <div class="slds-p-around_large slds-align_absolute-center">
            <lightning-spinner
                alternative-text="Loading scheduled jobs"
                size="small"></lightning-spinner>
        </div>
    </template>
    <template lwc:elseif={isEmpty}>
        <div class="slds-p-around_large slds-text-align_center slds-text-color_weak">
            No scheduled jobs found.
        </div>
    </template>
    <template lwc:else>
        <div class="jobs-table-wrap">
            <table
                class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">
                            <div class="slds-truncate" title="Job Name">Job Name</div>
                        </th>
                        <th scope="col"><div class="slds-truncate" title="Type">Type</div></th>
                        <th scope="col"><div class="slds-truncate" title="State">State</div></th>
                        <th scope="col"><div class="slds-truncate" title="Cron">Cron</div></th>
                        <th scope="col">
                            <div class="slds-truncate" title="Next Fire">Next Fire</div>
                        </th>
                        <th scope="col"><div class="slds-truncate" title="Times">Times</div></th>
                        <th scope="col"><span class="slds-assistive-text">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={renderedRows} for:item="row">
                        <tr key={row.id} class="slds-hint-parent">
                            <td><div class="slds-truncate" title={row.name}>{row.name}</div></td>
                            <td>
                                <div class="slds-truncate" title={row.jobType}>{row.jobType}</div>
                            </td>
                            <td><span class={row.stateClass}>{row.state}</span></td>
                            <td>
                                <div class="slds-truncate" title={row.cronExpression}>
                                    {row.cronExpression}
                                </div>
                            </td>
                            <td>
                                <div class="slds-truncate" title={row.nextFireTime}>
                                    {row.nextFireTime}
                                </div>
                            </td>
                            <td>{row.timesTriggered}</td>
                            <td>
                                <lightning-button
                                    variant="destructive-text"
                                    label="Abort"
                                    data-id={row.id}
                                    onclick={handleAbort}></lightning-button>
                            </td>
                        </tr>
                    </template>
                    <template lwc:if={hasMoreRows}>
                        <tr class="slds-hint-parent">
                            <td colspan="7">
                                <div
                                    class="slds-p-around_x-small slds-align_absolute-center slds-gutters_x-small">
                                    <span
                                        class="slds-text-body_small slds-text-color_weak slds-m-right_small">
                                        Showing {renderedRowCount} of {visibleRowCount} matching
                                        jobs.
                                    </span>
                                    <lightning-button
                                        variant="neutral"
                                        label="Show more"
                                        onclick={handleShowMore}></lightning-button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>
</template>
