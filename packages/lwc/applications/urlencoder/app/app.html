<template>
    <div class={pageClass}>
        <builder-editor>
            <builder-header
                slot="header"
                title="Tools"
                sub-title="URL Encoder"
                icon-name="utility:link">
                <div slot="actions" class="slds-builder-toolbar__actions">
                    <lightning-button
                        class="slds-p-left_xx-small"
                        variant="brand"
                        label="Run"
                        icon-name="utility:link"
                        onclick={handleRun}></lightning-button>
                    <lightning-button
                        class="slds-p-left_xx-small"
                        variant="neutral"
                        label="Copy"
                        icon-name="utility:copy"
                        disabled={isCopyDisabled}
                        onclick={handleCopy}></lightning-button>
                    <lightning-button
                        class="slds-p-left_xx-small"
                        variant="neutral"
                        label="Clear"
                        icon-name="utility:delete"
                        onclick={handleClear}></lightning-button>
                </div>
                <template lwc:if={showEmptyState}>
                    <p slot="meta" class="slds-page-header__meta-text slds-text-color_weak">
                        Paste a URL component into the input below to encode or decode.
                    </p>
                </template>
                <div slot="subactions" class="slds-builder-toolbar__actions">
                    <lightning-radio-group
                        name="mode"
                        label="Mode"
                        variant="label-hidden"
                        options={modeOptions}
                        value={mode}
                        type="button"
                        onchange={handleModeChange}></lightning-radio-group>
                </div>
            </builder-header>
            <article class="full-page-body slds-card slds-p-around_medium">
                <lightning-textarea
                    label="Input"
                    name="input"
                    value={input}
                    placeholder="Paste a URL component to encode or decode"
                    onchange={handleInputChange}></lightning-textarea>
                <lightning-textarea
                    class="slds-m-top_small"
                    label="Output"
                    name="output"
                    value={output}
                    readonly></lightning-textarea>
            </article>
        </builder-editor>
    </div>
</template>
