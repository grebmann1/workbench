<template>
    <div class="welcome-page">
        <section class="welcome-hero" aria-labelledby="welcome-heading">
            <p class="welcome-hero__eyebrow">Workbench</p>
            <h1 id="welcome-heading">{heading}</h1>
            <p class="welcome-hero__subtitle">{subtitle}</p>
            <div class="welcome-actions">
                <button type="button" class="connect-button" onclick={handleConnect}>
                    {connectLabel}
                </button>
                <button type="button" class="manage-button" onclick={handleGoToConnections}>
                    Manage connections
                </button>
            </div>
            <p class="welcome-hero__hint">
                Quick Connect creates a temporary session. Saved orgs are managed in Connections.
            </p>
        </section>
        <section aria-labelledby="tasks-heading">
            <h2 id="tasks-heading" class="section-title">Start a task</h2>
            <div class="task-grid">
                <template for:each={tasks} for:item="task">
                    <button
                        key={task.path}
                        type="button"
                        class="task-card"
                        data-path={task.path}
                        onclick={handleTask}>
                        <span class="task-title">
                            <lightning-icon icon-name={task.icon} size="small"></lightning-icon>
                            <span>{task.title}</span>
                        </span>
                        <span class="task-description">{task.description}</span>
                        <span class="task-link">{taskHint} · {task.label}</span>
                    </button>
                </template>
            </div>
        </section>
        <div class="welcome-grid">
            <div class="connection-column">
                <section class="welcome-card" aria-labelledby="saved-heading">
                    <div class="welcome-card__header">
                        <h2 id="saved-heading">Saved connections</h2>
                    </div>
                    <div class="welcome-card__body">
                        <p lwc:if={isLoadingSaved} role="status">Loading saved connections…</p>
                        <template lwc:else>
                            <p role="status">{savedSummary}</p>
                            <button
                                lwc:if={savedError}
                                class="slds-button"
                                type="button"
                                onclick={refreshConnections}>
                                Retry loading connections
                            </button>
                        </template>
                        <button
                            class="slds-button slds-m-top_small"
                            type="button"
                            onclick={handleGoToConnections}>
                            View saved connections
                        </button>
                    </div>
                </section>
                <section
                    class="browser-sessions"
                    lwc:if={isBrowserSessionsVisible}
                    aria-labelledby="sessions-heading">
                    <div class="browser-sessions__header">
                        <h2 id="sessions-heading" class="browser-sessions__title">
                            Active Browser Sessions
                        </h2>
                        <p class="browser-sessions__desc">
                            Salesforce orgs currently open in your browser
                        </p>
                    </div>
                    <template lwc:if={isLoadingSessions}>
                        <p class="visually-hidden" role="status">Looking for browser sessions…</p>
                        <div class="sessions-skeleton" aria-hidden="true">
                            <div class="sessions-skeleton__row"></div>
                            <div class="sessions-skeleton__row"></div>
                        </div>
                    </template>
                    <template lwc:elseif={sessionsError}>
                        <div class="sessions-empty">
                            <p class="sessions-empty__title" role="status">
                                Browser sessions could not be loaded.
                            </p>
                            <button
                                class="sessions-retry"
                                type="button"
                                onclick={refreshConnections}>
                                Retry browser sessions
                            </button>
                        </div>
                    </template>
                    <template lwc:elseif={hasSessions}>
                        <ul class="sessions-list" role="list">
                            <template for:each={sessions} for:item="session">
                                <li
                                    key={session.serverUrl}
                                    class="session-item"
                                    role="button"
                                    tabindex="0"
                                    aria-label={session.openLabel}
                                    data-server-url={session.serverUrl}
                                    data-session-id={session.sessionId}
                                    onclick={handleSessionOpen}
                                    onkeydown={handleSessionKeydown}>
                                    <span class="session-item__avatar" aria-hidden="true">
                                        <lightning-icon
                                            icon-name="utility:connected_apps"
                                            size="small"></lightning-icon>
                                    </span>
                                    <div class="session-item__body">
                                        <span class="session-item__label">{session.label}</span>
                                        <span class="session-item__detail">{session.detail}</span>
                                    </div>
                                    <lightning-icon
                                        icon-name="utility:chevronright"
                                        size="x-small"
                                        class="session-item__chevron"></lightning-icon>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <div class="sessions-empty">
                            <lightning-icon
                                icon-name="utility:connected_apps"
                                size="medium"
                                class="sessions-empty__icon"></lightning-icon>
                            <p class="sessions-empty__title">No active sessions found</p>
                            <p class="sessions-empty__hint">
                                Open a Salesforce org in a browser tab to see it here
                            </p>
                        </div>
                    </template>
                </section>
            </div>
            <aside class="welcome-sidebar" aria-label="Help and setup">
                <section class="welcome-card">
                    <div class="welcome-card__header"><h2>{aiTitle}</h2></div>
                    <div class="welcome-card__body">
                        <p>{aiDescription}</p>
                        <button
                            class="slds-button slds-m-top_small"
                            type="button"
                            onclick={handleOpenSettings}>
                            {aiActionLabel}
                        </button>
                    </div>
                </section>
                <section class="welcome-card">
                    <div class="welcome-card__header"><h2>Quick Tips</h2></div>
                    <div class="welcome-card__body">
                        <template for:each={tips} for:item="tip">
                            <div key={tip.id} class="tip-item">
                                <h3>{tip.title}</h3>
                                <p>{tip.message}</p>
                            </div>
                        </template>
                    </div>
                </section>
            </aside>
        </div>
        <footer class="welcome-footer">
            <button
                lwc:if={hasLatestRelease}
                type="button"
                class="slds-button"
                onclick={handleViewReleaseNotes}>
                {latestReleaseLabel}
            </button>
            <button type="button" class="slds-button" onclick={handleGitHub}>
                Questions or feedback
            </button>
        </footer>
    </div>
</template>
