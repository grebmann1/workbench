<template>
    <template lwc:if={isHeaderLess}>
        <!-- Card Variant -->
        <div class="slds-flex-column slds-p-horizontal_x-small slds-is-relative slds-full-height">
            <div class="slds-grid slds-wrap slds-grid_align-center slds-p-around_small">
                <div
                    class="slds-col slds-size_1-of-1 slds-grid slds-grid_align-center slds-m-bottom_x-small">
                    <div class="slds-p-horizontal_x-small">
                        <lightning-input
                            type="checkbox"
                            name="showOrgFarm"
                            label="OrgFarm"
                            checked={showOrgFarm}
                            onchange={handleOrgFarmFilterChange}></lightning-input>
                    </div>
                    <div class="slds-p-horizontal_x-small">
                        <lightning-input
                            type="checkbox"
                            name="showNonOrgFarm"
                            label="Non-OrgFarm"
                            checked={showNonOrgFarm}
                            onchange={handleOrgFarmFilterChange}></lightning-input>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-grid slds-grid_align-center">
                    <lightning-button
                        icon-name="utility:add"
                        variant="brand"
                        label="Add new org"
                        title="Add new org"
                        onclick={addConnectionClick}></lightning-button>
                </div>
                <!-- 
                This is not used anymore, but we keep it here for reference. It doesn't fit here anymore (chrome extension)
                <div class="slds-col slds-p-horizontal_x-small">
                    <lightning-button
                        icon-name="utility:salesforce1"
                        label="Manual Session"
                        title="Manual Session"
                        onclick={manualSessionClick}></lightning-button>
                </div> 
                -->
            </div>
            <div class="slds-fill-height slds-flex-column">
                <template lwc:if={isCardVariant}>
                    <template for:each={filteredFormatted} for:item="item">
                        <connection-card
                            key={item.key}
                            item={item}
                            onrowaction={handleRowAction}></connection-card>
                    </template>
                    <template lwc:if={isNoRecord}>
                        <div class="connection-empty-state">
                            <illustration-empty title="No orgs"></illustration-empty>
                            <p class="connection-empty-state__hint">
                                Use
                                <strong>Add Org</strong>
                                above to save your first org, or pick an active session below.
                            </p>
                        </div>
                    </template>
                </template>
                <!-- Active Browser Sessions (card/side-panel only) -->
                <div class="browser-sessions" lwc:if={isBrowserSessionsVisible}>
                    <div class="browser-sessions__header">
                        <h2 class="browser-sessions__title">Active Browser Sessions</h2>
                        <p class="browser-sessions__desc">
                            Salesforce orgs currently open in your browser
                        </p>
                    </div>
                    <template lwc:if={isLoadingSessions}>
                        <div class="sessions-skeleton" aria-hidden="true">
                            <div class="sessions-skeleton__row"></div>
                            <div class="sessions-skeleton__row"></div>
                        </div>
                    </template>
                    <template lwc:elseif={hasSessions}>
                        <ul class="sessions-list" role="list">
                            <template for:each={sessions} for:item="session">
                                <li
                                    key={session.serverUrl}
                                    class="session-item"
                                    role="button"
                                    tabindex="0"
                                    data-server-url={session.serverUrl}
                                    data-session-id={session.sessionId}
                                    onclick={handleSessionClick}
                                    onkeydown={handleSessionKeydown}>
                                    <span class="session-item__avatar" aria-hidden="true">
                                        <lightning-icon
                                            icon-name="utility:connected_apps"
                                            size="small"></lightning-icon>
                                    </span>
                                    <div class="session-item__body">
                                        <span class="session-item__label">{session.label}</span>
                                        <span class="session-item__detail">{session.detail}</span>
                                    </div>
                                    <lightning-icon
                                        icon-name="utility:chevronright"
                                        size="x-small"
                                        class="session-item__chevron"></lightning-icon>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <div class="sessions-empty">
                            <lightning-icon
                                icon-name="utility:connected_apps"
                                size="medium"
                                class="sessions-empty__icon"></lightning-icon>
                            <p class="sessions-empty__title">No active sessions found</p>
                            <p class="sessions-empty__hint">
                                Open a Salesforce org in a browser tab to see it here
                            </p>
                        </div>
                    </template>
                </div>
            </div>
            <!-- Loading -->
            <template lwc:if={isLoading}>
                <slds-spinner
                    message={loadingMessage}
                    alternative-text="Loading"
                    size="small"></slds-spinner>
            </template>
        </div>
    </template>
    <template lwc:else>
        <div class="slds-page-header slds-page-header_joined slds-overflow-hidden">
            <div class={headerRowClass}>
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:default"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span>My Salesforce Connections</span>
                                        <span
                                            class="slds-page-header__title slds-truncate"
                                            title="Authorized Orgs">
                                            Authorized Orgs
                                        </span>
                                    </h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions slds-align-middle slds-p-bottom_none">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <!-- <lightning-button icon-name="utility:knowledge_base" label="Documentation Explorer"></lightning-button> -->
                            <lightning-button-group>
                                <lightning-button
                                    icon-name="utility:link"
                                    label="Quick Connect"
                                    title="Quick Connect"
                                    variant="brand"
                                    onclick={directConnectClick}></lightning-button>
                                <lightning-button
                                    icon-name="utility:key"
                                    label="Manual Session"
                                    title="Manual Session"
                                    onclick={manualSessionClick}></lightning-button>
                                <lightning-button
                                    icon-name="utility:add"
                                    label="Add Org"
                                    title="org"
                                    onclick={addConnectionClick}></lightning-button>
                                <lightning-button-menu
                                    variant="border-filled"
                                    menu-alignment="auto"
                                    alternative-text="Show menu"
                                    class="connection-drop-button">
                                    <lightning-menu-item
                                        prefix-icon-name="utility:upload"
                                        icon-size="small"
                                        value="Import"
                                        label="Import orgs"
                                        onclick={importClick}></lightning-menu-item>
                                    <lightning-menu-item
                                        prefix-icon-name="utility:download"
                                        icon-size="small"
                                        value="Export"
                                        label="Export orgs"
                                        onclick={exportClick}></lightning-menu-item>
                                </lightning-button-menu>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-page-header__row_gutters">
                <!-- slds-page-header__row-->
                <div class="slds-page-header__col-details">
                    <div class={detailRowClass}>
                        <template lwc:if={isInjected}>
                            <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                                <div class="slds-col">
                                    <lightning-button-group>
                                        <lightning-button-icon-stateful
                                            icon-name="utility:tile_card_list"
                                            selected={isCardVariant}
                                            onclick={displayCard}></lightning-button-icon-stateful>
                                        <lightning-button-icon-stateful
                                            icon-name="utility:list"
                                            selected={isTableVariant}
                                            onclick={displayTable}></lightning-button-icon-stateful>
                                    </lightning-button-group>
                                </div>
                                <div class="slds-col">
                                    <lightning-input
                                        type="toggle"
                                        label="Sync from Extension"
                                        name="filterFields"
                                        message-toggle-active=""
                                        message-toggle-inactive=""
                                        checked={loadFromExtension}
                                        onchange={handleLoadFromExtensionChange}></lightning-input>
                                </div>
                            </div>
                        </template>
                        <template lwc:if={isLoading}>
                            <slds-spinner alternative-text="Loading" size="small"></slds-spinner>
                        </template>

                        <!-- Search -->
                        <!-- Filters -->
                        <div class="slds-grid slds-wrap slds-m-bottom_x-small slds-gutters_x-small">
                            <div
                                class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4">
                                <lightning-input
                                    type="checkbox"
                                    name="showOrgFarm"
                                    label="OrgFarm"
                                    checked={showOrgFarm}
                                    onchange={handleOrgFarmFilterChange}></lightning-input>
                            </div>
                            <div
                                class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4">
                                <lightning-input
                                    type="checkbox"
                                    name="showNonOrgFarm"
                                    label="Non-OrgFarm"
                                    checked={showNonOrgFarm}
                                    onchange={handleOrgFarmFilterChange}></lightning-input>
                            </div>
                        </div>
                        <lightning-input
                            class="slds-m-bottom_medium"
                            type="search"
                            label="Search"
                            variant="label-hidden"
                            onchange={handleFieldsFilter}></lightning-input>

                        <!-- Table Variant -->
                        <template lwc:if={isTableVariant}>
                            <lightning-datatable
                                class="slds-flex-column"
                                key-field="id"
                                data={filteredOriginal}
                                columns={columns}
                                onrowaction={handleRowAction}
                                hide-checkbox-column></lightning-datatable>
                        </template>

                        <!-- Card Variant -->
                        <template lwc:if={isCardVariant}>
                            <template for:each={filteredFormatted} for:item="item">
                                <connection-card
                                    key={item.key}
                                    item={item}
                                    onrowaction={handleRowAction}></connection-card>
                            </template>
                        </template>
                        <!-- empty state -->
                        <template lwc:if={isNoRecord}>
                            <div class="connection-empty-state connection-empty-state--full">
                                <illustration-empty title="No orgs"></illustration-empty>
                                <p class="connection-empty-state__desc">
                                    No saved org yet. Add one to your list, or connect directly
                                    without saving.
                                </p>
                                <div class="connection-empty-state__actions">
                                    <lightning-button
                                        icon-name="utility:add"
                                        label="Add Org"
                                        variant="brand"
                                        onclick={addConnectionClick}></lightning-button>
                                    <lightning-button
                                        icon-name="utility:link"
                                        label="Quick Connect"
                                        onclick={directConnectClick}></lightning-button>
                                    <lightning-button
                                        icon-name="utility:key"
                                        label="Manual Session"
                                        onclick={manualSessionClick}></lightning-button>
                                </div>
                            </div>
                        </template>

                        <!-- Active Browser Sessions (full-panel) -->
                        <div
                            class="browser-sessions browser-sessions--full"
                            lwc:if={isBrowserSessionsVisible}>
                            <div class="browser-sessions__header">
                                <h2 class="browser-sessions__title">Active Browser Sessions</h2>
                                <p class="browser-sessions__desc">
                                    Salesforce orgs currently open in your browser
                                </p>
                            </div>
                            <template lwc:if={isLoadingSessions}>
                                <div class="sessions-skeleton" aria-hidden="true">
                                    <div class="sessions-skeleton__row"></div>
                                    <div class="sessions-skeleton__row"></div>
                                </div>
                            </template>
                            <template lwc:elseif={hasSessions}>
                                <ul class="sessions-list sessions-list--full" role="list">
                                    <template for:each={sessions} for:item="session">
                                        <li
                                            key={session.serverUrl}
                                            class="session-item"
                                            role="button"
                                            tabindex="0"
                                            data-server-url={session.serverUrl}
                                            data-session-id={session.sessionId}
                                            onclick={handleSessionClick}
                                            onkeydown={handleSessionKeydown}>
                                            <span class="session-item__avatar" aria-hidden="true">
                                                <lightning-icon
                                                    icon-name="utility:connected_apps"
                                                    size="small"></lightning-icon>
                                            </span>
                                            <div class="session-item__body">
                                                <span class="session-item__label">
                                                    {session.label}
                                                </span>
                                                <span class="session-item__detail">
                                                    {session.detail}
                                                </span>
                                            </div>
                                            <lightning-icon
                                                icon-name="utility:chevronright"
                                                size="x-small"
                                                class="session-item__chevron"></lightning-icon>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <div class="sessions-empty">
                                    <lightning-icon
                                        icon-name="utility:connected_apps"
                                        size="medium"
                                        class="sessions-empty__icon"></lightning-icon>
                                    <p class="sessions-empty__title">No active sessions found</p>
                                    <p class="sessions-empty__hint">
                                        Open a Salesforce org in a browser tab to see it here
                                    </p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
