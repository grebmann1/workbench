<template>
    <div class={publisherClass}>
        <div class="slds-grid slds-wrap slds-grid_align-center">
            <div class="slds-col slds-size_1-of-1">
                <template lwc:if={hasQueuedMessages}>
                    <div class="chat-queue-panel">
                        <div class="chat-queue-header">
                            <span class="chat-queue-label">{queueLabel}</span>
                            <template lwc:if={queuePaused}>
                                <button type="button" onclick={handleResumeQueue}>
                                    Resume queue
                                </button>
                            </template>
                        </div>
                        <template for:each={_queuedMessages} for:item="msg">
                            <div key={msg.id} class="chat-queue-item">
                                <template lwc:if={msg.isPush}>
                                    <span
                                        class="chat-queue-item-badge chat-queue-item-badge_push"
                                        title="Priority — executes next">
                                        ↑
                                    </span>
                                </template>
                                <template lwc:if={msg.recovered}>
                                    <span class="chat-queue-item-badge">
                                        Recovered · review before resume
                                    </span>
                                </template>
                                <span class="chat-queue-item-text">{msg.prompt}</span>
                                <button
                                    class="chat-queue-item-action"
                                    title="Promote to priority (execute next)"
                                    aria-label="Promote to priority"
                                    data-queue-id={msg.id}
                                    onclick={handlePromoteQueued}>
                                    ↑
                                </button>
                                <button
                                    class="chat-queue-item-action chat-queue-item-remove"
                                    title="Remove queued message"
                                    aria-label="Remove queued message"
                                    data-queue-id={msg.id}
                                    onclick={handleRemoveQueued}>
                                    ×
                                </button>
                            </div>
                        </template>
                    </div>
                </template>
                <div
                    class="chat-input-container file-upload-container"
                    ondragover={handleDragOver}
                    ondragleave={handleDragLeave}
                    ondrop={handleDrop}>
                    <div class="slds-flex-column slds-align-flex-end">
                        <div class="chat-input-model-row">
                            <div class="chat-model-select-col">
                                <select
                                    id="model-picklist"
                                    class="chat-select chat-select-model"
                                    onchange={handleModelChange}
                                    aria-label="Model">
                                    <template lwc:if={hasMultipleProviderGroups}>
                                        <template
                                            for:each={renderedModelOptionGroups}
                                            for:item="group">
                                            <optgroup key={group.key} label={group.label}>
                                                <template for:each={group.options} for:item="model">
                                                    <option
                                                        key={model.value}
                                                        value={model.value}
                                                        selected={model.isSelected}>
                                                        {model.displayLabel}
                                                    </option>
                                                </template>
                                            </optgroup>
                                        </template>
                                    </template>
                                    <template lwc:else>
                                        <template for:each={renderedModelOptions} for:item="model">
                                            <option
                                                key={model.value}
                                                value={model.value}
                                                selected={model.isSelected}>
                                                {model.displayLabel}
                                            </option>
                                        </template>
                                    </template>
                                </select>
                            </div>
                            <div class="chat-reasoning-col">
                                <slds-reasoning
                                    class="chat-reasoning-control"
                                    value={selectedReasoning}
                                    onchange={handleReasoningChange}></slds-reasoning>
                            </div>
                        </div>
                    </div>
                    <template lwc:if={hasFiles}>
                        <div class="chat-input-pills-row">
                            <template for:each={filePills} for:item="pill">
                                <div
                                    key={pill.file.name}
                                    class="chat-pill"
                                    tabindex="0"
                                    aria-label={pill.file.name}>
                                    <template lwc:if={pill.isImage}>
                                        <img
                                            src={pill.preview}
                                            alt="Image preview"
                                            class="chat-pill-thumbnail" />
                                        <span>Image</span>
                                    </template>
                                    <template lwc:else>
                                        <span class="chat-pill-icon">📎</span>
                                        <span>{pill.file.name}</span>
                                    </template>
                                    <button
                                        class="chat-pill-remove"
                                        title="Remove file"
                                        aria-label="Remove file"
                                        data-filename={pill.file.name}
                                        onclick={removeSelectedFile}
                                        tabindex="0">
                                        ×
                                    </button>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template lwc:if={hasSlashSuggestions}>
                        <div
                            class="publisher-slash-menu"
                            role="listbox"
                            aria-label="Slash commands">
                            <div class="publisher-slash-header">
                                Commands
                                <span class="publisher-slash-hint">
                                    ↑↓ navigate · ↵ run · esc dismiss
                                </span>
                            </div>
                            <template
                                for:each={slashSuggestions}
                                for:item="suggestion"
                                for:index="index">
                                <button
                                    key={suggestion.key}
                                    type="button"
                                    class={suggestion.activeClass}
                                    role="option"
                                    aria-selected={suggestion.isActive}
                                    data-index={index}
                                    onmousedown={handleSlashSuggestionClick}
                                    onmouseenter={handleSlashSuggestionHover}>
                                    <lightning-icon
                                        icon-name={suggestion.iconName}
                                        size="x-small"
                                        class="publisher-slash-item-icon"></lightning-icon>
                                    <span class="publisher-slash-item-label">
                                        /
                                        <span class="publisher-slash-item-match">
                                            {suggestion.matchedPart}
                                        </span>
                                        <span class="publisher-slash-item-remainder">
                                            {suggestion.remainderPart}
                                        </span>
                                    </span>
                                    <span class="publisher-slash-item-desc">
                                        {suggestion.description}
                                    </span>
                                </button>
                            </template>
                        </div>
                    </template>
                    <textarea
                        id="comment-text-input2"
                        class="chat-textarea"
                        placeholder={promptPlaceholder}
                        onkeydown={handleKeyDown}
                        oninput={handleInputChange}
                        aria-label="Prompt input"></textarea>
                    <div class="chat-input-actions-row">
                        <div class="chat-input-actions-left">
                            <template lwc:if={assistantStyle}>
                                <button
                                    class="composer-action"
                                    type="button"
                                    aria-label="Attach File"
                                    title="Attach a file"
                                    onclick={triggerFileInput}>
                                    <slds-lucide-icon name="paperclip" size="18"></slds-lucide-icon>
                                </button>
                            </template>
                            <template lwc:if={isAudioRecorderDisplayed}>
                                <agent-audio-recorder
                                    openai-key={openaiKey}
                                    onchange={handleSpeechChange}></agent-audio-recorder>
                            </template>
                        </div>
                        <template lwc:if={assistantStyle}>
                            <span class="composer-hint">Enter to send · / for tools</span>
                        </template>
                        <div class="chat-input-actions-right">
                            <template lwc:if={assistantStyle}>
                                <template lwc:if={isLoading}>
                                    <button
                                        class="composer-action composer-stop"
                                        type="button"
                                        aria-label="Stop"
                                        title="Stop the current response"
                                        onclick={handleStopClick}>
                                        <slds-lucide-icon
                                            name="square"
                                            size="16"></slds-lucide-icon>
                                    </button>
                                    <template lwc:if={showPushButton}>
                                        <button
                                            class="composer-action"
                                            type="button"
                                            aria-label="Queue message next"
                                            title="Queue next"
                                            onclick={handlePushClick}>
                                            <slds-lucide-icon
                                                name="list-start"
                                                size="18"></slds-lucide-icon>
                                        </button>
                                    </template>
                                    <button
                                        class="composer-action composer-send"
                                        type="button"
                                        aria-label="Queue message"
                                        title="Send after the current response"
                                        disabled={isSendButtonDisabled}
                                        onclick={handleSendClick}>
                                        <slds-lucide-icon
                                            name="list-plus"
                                            size="18"></slds-lucide-icon>
                                    </button>
                                </template>
                                <template lwc:else>
                                    <button
                                        class="composer-action composer-send"
                                        type="button"
                                        aria-label="Send"
                                        title="Send message"
                                        disabled={isSendButtonDisabled}
                                        onclick={handleSendClick}>
                                        <slds-lucide-icon
                                            name="arrow-up"
                                            size="19"></slds-lucide-icon>
                                    </button>
                                </template>
                            </template>
                            <template lwc:else>
                                <lightning-button-group>
                                    <lightning-button-icon
                                        icon-name="utility:attach"
                                        size="medium"
                                        variant="border-filled"
                                        alternative-text="Attach File"
                                        title="Attach File"
                                        onclick={triggerFileInput}></lightning-button-icon>
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        size="medium"
                                        variant="border-filled"
                                        alternative-text="Clear"
                                        title="Clear"
                                        onclick={handleClearClick}></lightning-button-icon>
                                    <template lwc:if={isLoading}>
                                        <lightning-button-icon
                                            icon-name="utility:stop"
                                            size="medium"
                                            variant="border-filled"
                                            alternative-text="Stop"
                                            title="Stop"
                                            onclick={handleStopClick}></lightning-button-icon>
                                        <template lwc:if={showPushButton}>
                                            <lightning-button-icon
                                                icon-name="utility:forward_up"
                                                size="medium"
                                                variant="border-filled"
                                                alternative-text="Queue message next"
                                                title="Queue next (after the current response)"
                                                onclick={handlePushClick}></lightning-button-icon>
                                        </template>
                                        <lightning-button-icon
                                            icon-name="utility:send"
                                            size="medium"
                                            variant="border-filled"
                                            alternative-text="Queue message"
                                            title="Queue message (send after current response)"
                                            onclick={handleSendClick}></lightning-button-icon>
                                    </template>
                                    <template lwc:else>
                                        <lightning-button-icon
                                            icon-name="utility:send"
                                            size="medium"
                                            variant="border-filled"
                                            alternative-text="Send"
                                            title="Send"
                                            disabled={isSendButtonDisabled}
                                            onclick={handleSendClick}></lightning-button-icon>
                                    </template>
                                </lightning-button-group>
                            </template>
                        </div>
                        <input
                            type="file"
                            class="file-input"
                            onchange={handleFileChange}
                            aria-label="File input"
                            tabindex="-1"
                            multiple
                            accept="image/*,application/pdf,text/csv,application/json,text/plain,.csv,.json,.txt" />
                    </div>
                    <template lwc:if={dragActive}>
                        <div class="file-upload-drag-overlay">Drop images here</div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
