<template>
    <div class={containerClass} data-tool={toolName}>
        <button
            type="button"
            class="tool-header-button"
            onclick={handleToggle}
            aria-expanded={expanded}
            aria-label={toggleAriaLabel}>
            <template lwc:if={assistantStyle}>
                <span class="assistant-tool-heading">
                    <span class="assistant-tool-kind" title={toolCategory}>
                        <slds-lucide-icon
                            name={toolKindIcon}
                            size="14"
                            aria-hidden="true"></slds-lucide-icon>
                        <span class="slds-assistive-text">{toolCategory}</span>
                    </span>
                    <span class="assistant-tool-description" title={title}>{title}</span>
                    <span class={toolStateClass} title={toolStatusLabel}>
                        <template lwc:if={hasSuccessfulResult}>
                            <slds-lucide-icon
                                name="check"
                                size="13"
                                aria-hidden="true"></slds-lucide-icon>
                            <span class="slds-assistive-text">{toolStatusLabel}</span>
                        </template>
                        <template lwc:else>{toolStatusLabel}</template>
                    </span>
                    <slds-lucide-icon
                        name={assistantToggleIcon}
                        size="13"
                        aria-hidden="true"></slds-lucide-icon>
                </span>
            </template>
            <template lwc:else>
                <span class={statusClass}>
                    <lightning-icon
                        icon-name={statusIconName}
                        variant={statusIconVariant}
                        class={statusIconClass}
                        size="xx-small"
                        alternative-text="Tool status"></lightning-icon>
                    <span class="tool-title">{title}</span>
                    <lightning-icon
                        icon-name={toggleIconName}
                        class="tool-toggle-icon"
                        size="xx-small"
                        alternative-text="Toggle tool details"></lightning-icon>
                </span>
            </template>
        </button>

        <template lwc:if={showCommandPreview}>
            <pre
                class="assistant-command-preview"
                title={commandText}><code>{commandText}</code></pre>
        </template>
        <template lwc:if={expanded}>
            <template lwc:if={assistantStyle}>
                <div class="assistant-tool-metadata">
                    <span>{toolCategory}</span>
                    <code>{toolName}</code>
                    <span>{toolStatusLabel}</span>
                </div>
            </template>
            <div class="tool-section">
                <div class="tool-section-label">{commandLabel}</div>
                <pre class="tool-section-body"><code>{commandText}</code></pre>
            </div>

            <template lwc:if={effectiveToolResult}>
                <div class="tool-section">
                    <div class="tool-result-header">
                        <span class="tool-section-label">{resultLabel}</span>
                        <template lwc:if={canCopyResult}>
                            <button
                                type="button"
                                class="tool-copy-button"
                                onclick={handleCopyResult}
                                title={copyLabel}
                                aria-label={copyLabel}>
                                <lightning-icon
                                    icon-name={copyIconName}
                                    class="tool-copy-icon"
                                    size="xx-small"
                                    alternative-text={copyLabel}></lightning-icon>
                                <span class="tool-copy-label">{copyLabel}</span>
                            </button>
                        </template>
                    </div>
                    <pre class="tool-section-body"><code>{resultText}</code></pre>
                    <template lwc:if={resultImages.length}>
                        <div class="tool-result-images slds-m-top_x-small">
                            <template for:each={resultImages} for:item="resultImage">
                                <img
                                    key={resultImage.key}
                                    class="tool-result-image"
                                    src={resultImage.src}
                                    alt="Tool result screenshot" />
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </template>
    </div>
</template>
