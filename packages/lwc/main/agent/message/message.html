<template>
    <li class={itemClass}>
        <div class="slds-chat-message">
            <div class="slds-chat-message__body">
                <template lwc:if={showSpeakerLabel}>
                    <div class="assistant-speaker">
                        <template lwc:if={isAssistant}>
                            <slds-lucide-icon name="sparkles" size="14"></slds-lucide-icon>
                        </template>
                        {originMessage}
                    </div>
                </template>
                <div class={itemMessageClass}>
                    <template for:each={renderedParts} for:item="part">
                        <template lwc:if={part.isReasoning}>
                            <agent-reasoning-block
                                key={part.key}
                                class="reasoning-block-item"
                                assistant-style={assistantStyle}
                                content={part.text}
                                state={part.state}
                                is-pulsing={isReasoningStreaming}></agent-reasoning-block>
                        </template>
                        <template lwc:elseif={part.isTool}>
                            <agent-tool-message
                                key={part.key}
                                assistant-style={assistantStyle}
                                tool-part={part.toolPart}
                                tool-call={part.toolCall}
                                tool-result={part.toolResult}></agent-tool-message>
                        </template>
                        <template lwc:elseif={part.isFile}>
                            <div
                                key={part.key}
                                class="message-content-file slds-m-vertical_x-small">
                                <template lwc:if={part.isImage}>
                                    <img
                                        class="message-content-image"
                                        src={part.url}
                                        alt={part.filename} />
                                </template>
                                <template lwc:if={part.filename}>
                                    <a href={part.url} target="_blank" rel="noreferrer">
                                        {part.filename}
                                    </a>
                                </template>
                                <template lwc:else>
                                    <a href={part.url} target="_blank" rel="noreferrer">
                                        Open file
                                    </a>
                                </template>
                            </div>
                        </template>
                        <template lwc:elseif={part.isText}>
                            <div key={part.key} class="message-content-text">
                                <template lwc:if={isUser}>{part.text}</template>
                                <template lwc:else>
                                    <slds-markdown-viewer
                                        chat-code
                                        block-remote-images
                                        class="slds-flex-column slds-full-height"
                                        value={part.text}
                                        salesforce-instance-url={salesforceInstanceUrl}
                                        onchange={handleChange}></slds-markdown-viewer>
                                </template>
                            </div>
                        </template>
                    </template>
                    <template lwc:if={showAssistantEmptyFallback}>
                        <div class="message-content-text agent-message-empty-fallback">—</div>
                    </template>
                </div>
                <template lwc:if={canCopyMessage}>
                    <div class="message-actions-row slds-m-top_xx-small">
                        <template lwc:if={assistantStyle}>
                            <button
                                class="assistant-copy"
                                type="button"
                                title="Copy message"
                                aria-label="Copy message"
                                onclick={handleCopyMessage}>
                                <slds-lucide-icon name="copy" size="13"></slds-lucide-icon>
                                Copy
                            </button>
                        </template>
                        <template lwc:else>
                            <lightning-button-icon
                                icon-name="utility:copy"
                                variant="bare"
                                size="small"
                                title="Copy message"
                                alternative-text="Copy message"
                                class="message-copy-button"
                                onclick={handleCopyMessage}></lightning-button-icon>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </li>
</template>
