<template>
    <div class="slds-grid slds-wrap slds-grid_vertical-stretch">
        <template lwc:if={hideLlmSettingsCard}></template>
        <template lwc:else>
            <lightning-card
                class="settings slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-around_medium">
                <div slot="title">
                    <h1>LLM Settings</h1>
                    <p class="description slds-truncate">Settings related to LLM integration.</p>
                </div>
                <div class="slds-grid slds-wrap">
                    <settings-card
                        class="slds-col slds-size_1-of-1 slds-p-horizontal_small"
                        is-first>
                        <div slot="title">
                            <h1>
                                Autocomplete
                                <lightning-badge
                                    label="Disabled"
                                    class="slds-m-left_x-small"></lightning-badge>
                            </h1>
                            <p class="description slds-truncate">
                                Select the AI provider to use for the Autocomplete feature.
                            </p>
                        </div>
                        <lightning-input
                            label="AI Provider"
                            value="Mistral"
                            variant="label-hidden"
                            class="slds-full-width"
                            disabled></lightning-input>
                    </settings-card>
                </div>
            </lightning-card>
        </template>
        <lightning-card class="settings slds-col slds-size_1-of-1 slds-p-around_medium">
            <div slot="title">
                <h1>AI Providers</h1>
                <p class="description slds-truncate">
                    Configure API keys and endpoints for each LLM provider.
                </p>
            </div>
            <div slot="actions">
                <lightning-button
                    label="Setup AI Provider"
                    icon-name="utility:setup"
                    variant="brand"
                    onclick={handleOpenOnboardAiProvider}></lightning-button>
            </div>
            <template lwc:if={hasInternalProvider}>
                <p
                    class="internal-provider-hint slds-text-body_small slds-text-color_weak slds-p-horizontal_medium slds-p-bottom_small">
                    Using the Salesforce internal gateway — a few model quirks (OpenAI
                    <code>/responses</code>
                    text bursts, Gemini preview thought parts, Opus&#8209;4&#8209;7 thinking gap)
                    are documented in the
                    <a href={internalProviderDocsUrl} target="_blank" rel="noopener noreferrer">
                        LLM Provider Runtime guide
                    </a>
                    .
                </p>
            </template>
            <slds-tabset variant="vertical">
                <slds-tab label="OpenAI" value="openai">
                    <div class="slds-grid slds-wrap slds-p-around_small">
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-right_x-small">
                            <div class="provider-key-row">
                                <lightning-input
                                    data-key="openai_key"
                                    label="API Key"
                                    onchange={inputfield_change}
                                    type="password"
                                    value={config.openai_key}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <div class="provider-key-btn">
                                    <lightning-button-icon
                                        data-key="openai_key"
                                        alternative-text="Toggle visibility"
                                        icon-name="utility:preview"
                                        onclick={handleToggleVisibility}></lightning-button-icon>
                                </div>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-left_x-small">
                            <lightning-input
                                data-key="openai_url"
                                label="Endpoint"
                                onchange={inputfield_change}
                                type="text"
                                value={config.openai_url}
                                variant="label-stacked"
                                class="slds-full-width"></lightning-input>
                        </div>
                    </div>
                    <div class="oauth-connect slds-p-horizontal_small slds-p-bottom_small">
                        <div class="oauth-connect__divider">or</div>
                        <div class={codexPanelClass}>
                            <div class="oauth-connect__info">
                                <span class="oauth-connect__title">
                                    ChatGPT subscription (Codex)
                                </span>
                                <span class="oauth-connect__desc">
                                    <template lwc:if={codexConnected}>
                                        Signed in — models served from your ChatGPT plan.
                                    </template>
                                    <template lwc:else>
                                        Sign in with your ChatGPT plan instead of an API key.
                                    </template>
                                </span>
                            </div>
                            <div class="oauth-connect__actions">
                                <template lwc:if={codexConnected}>
                                    <span class="oauth-status">
                                        <span class="oauth-status__dot"></span>
                                        Connected
                                    </span>
                                    <lightning-button
                                        label="Refresh models"
                                        icon-name="utility:refresh"
                                        variant="neutral"
                                        disabled={isRefreshingModels}
                                        onclick={handleRefreshModels}></lightning-button>
                                    <lightning-button
                                        label="Sign out"
                                        variant="destructive-text"
                                        data-provider="codex"
                                        onclick={handleProviderDisconnect}></lightning-button>
                                </template>
                                <template lwc:else>
                                    <lightning-button
                                        label="Sign in with ChatGPT"
                                        variant="brand"
                                        data-provider="codex"
                                        disabled={isSigningIn}
                                        onclick={handleProviderSignIn}></lightning-button>
                                </template>
                            </div>
                        </div>
                        <template lwc:if={showCodexCodeInput}>
                            <div class="oauth-connect__extra">
                                <lightning-input
                                    label="Authorization code"
                                    placeholder="Paste the code if the page shows one"
                                    value={pastedCode}
                                    onchange={handlePastedCodeChange}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <lightning-button
                                    label="Submit code"
                                    variant="brand"
                                    data-provider="codex"
                                    disabled={isSigningIn}
                                    onclick={handleSubmitCode}
                                    class="slds-m-top_x-small"></lightning-button>
                            </div>
                        </template>
                        <template lwc:if={codexNeedsManualModel}>
                            <div class="oauth-connect__extra">
                                <lightning-input
                                    data-provider="codex"
                                    label="Model"
                                    placeholder="e.g. gpt-5.1-codex-mini"
                                    value={codexCustomModel}
                                    onchange={handleCustomModelChange}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <p
                                    class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    No models returned from your ChatGPT subscription — type a model
                                    name to use.
                                </p>
                            </div>
                        </template>
                    </div>
                </slds-tab>
                <slds-tab label="Anthropic" value="anthropic">
                    <div class="slds-grid slds-wrap slds-p-around_small">
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-right_x-small">
                            <div class="provider-key-row">
                                <lightning-input
                                    data-key="anthropic_key"
                                    label="API Key"
                                    onchange={inputfield_change}
                                    type="password"
                                    value={config.anthropic_key}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <div class="provider-key-btn">
                                    <lightning-button-icon
                                        data-key="anthropic_key"
                                        alternative-text="Toggle visibility"
                                        icon-name="utility:preview"
                                        onclick={handleToggleVisibility}></lightning-button-icon>
                                </div>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-left_x-small">
                            <lightning-input
                                data-key="anthropic_url"
                                label="Endpoint"
                                onchange={inputfield_change}
                                type="text"
                                value={config.anthropic_url}
                                variant="label-stacked"
                                class="slds-full-width"></lightning-input>
                        </div>
                    </div>
                </slds-tab>
                <slds-tab label="Gemini" value="gemini">
                    <div class="slds-grid slds-wrap slds-p-around_small">
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-right_x-small">
                            <div class="provider-key-row">
                                <lightning-input
                                    data-key="gemini_key"
                                    label="API Key"
                                    onchange={inputfield_change}
                                    type="password"
                                    value={config.gemini_key}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <div class="provider-key-btn">
                                    <lightning-button-icon
                                        data-key="gemini_key"
                                        alternative-text="Toggle visibility"
                                        icon-name="utility:preview"
                                        onclick={handleToggleVisibility}></lightning-button-icon>
                                </div>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-left_x-small">
                            <lightning-input
                                data-key="gemini_url"
                                label="Endpoint"
                                onchange={inputfield_change}
                                type="text"
                                value={config.gemini_url}
                                variant="label-stacked"
                                class="slds-full-width"></lightning-input>
                        </div>
                    </div>
                </slds-tab>
                <slds-tab label="Mistral" value="mistral">
                    <div class="slds-grid slds-wrap slds-p-around_small">
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-right_x-small">
                            <div class="provider-key-row">
                                <lightning-input
                                    data-key="mistral_key"
                                    label="API Key"
                                    onchange={inputfield_change}
                                    type="password"
                                    value={config.mistral_key}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <div class="provider-key-btn">
                                    <lightning-button-icon
                                        data-key="mistral_key"
                                        alternative-text="Toggle visibility"
                                        icon-name="utility:preview"
                                        onclick={handleToggleVisibility}></lightning-button-icon>
                                </div>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-left_x-small">
                            <lightning-input
                                data-key="mistral_url"
                                label="Endpoint"
                                onchange={inputfield_change}
                                type="text"
                                value={config.mistral_url}
                                variant="label-stacked"
                                class="slds-full-width"></lightning-input>
                        </div>
                    </div>
                </slds-tab>
                <slds-tab label="xAI Grok" value="grok">
                    <div class="slds-grid slds-wrap slds-p-around_small">
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-right_x-small">
                            <div class="provider-key-row">
                                <lightning-input
                                    data-key="grok_key"
                                    label="API Key"
                                    onchange={inputfield_change}
                                    type="password"
                                    value={config.grok_key}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <div class="provider-key-btn">
                                    <lightning-button-icon
                                        data-key="grok_key"
                                        alternative-text="Toggle visibility"
                                        icon-name="utility:preview"
                                        onclick={handleToggleVisibility}></lightning-button-icon>
                                </div>
                            </div>
                        </div>
                        <div
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-p-left_x-small">
                            <lightning-input
                                data-key="grok_url"
                                label="Endpoint"
                                onchange={inputfield_change}
                                type="text"
                                value={config.grok_url}
                                variant="label-stacked"
                                class="slds-full-width"></lightning-input>
                        </div>
                    </div>
                    <div class="oauth-connect slds-p-horizontal_small slds-p-bottom_small">
                        <div class="oauth-connect__divider">or</div>
                        <div class={xaiPanelClass}>
                            <div class="oauth-connect__info">
                                <span class="oauth-connect__title">SuperGrok subscription</span>
                                <span class="oauth-connect__desc">
                                    <template lwc:if={xaiConnected}>
                                        Signed in — models served from your SuperGrok plan.
                                    </template>
                                    <template lwc:else>
                                        Sign in with your SuperGrok plan instead of an API key.
                                    </template>
                                </span>
                            </div>
                            <div class="oauth-connect__actions">
                                <template lwc:if={xaiConnected}>
                                    <span class="oauth-status">
                                        <span class="oauth-status__dot"></span>
                                        Connected
                                    </span>
                                    <lightning-button
                                        label="Refresh models"
                                        icon-name="utility:refresh"
                                        variant="neutral"
                                        disabled={isRefreshingModels}
                                        onclick={handleRefreshModels}></lightning-button>
                                    <lightning-button
                                        label="Sign out"
                                        variant="destructive-text"
                                        data-provider="xai"
                                        onclick={handleProviderDisconnect}></lightning-button>
                                </template>
                                <template lwc:else>
                                    <lightning-button
                                        label="Sign in with xAI"
                                        variant="brand"
                                        data-provider="xai"
                                        disabled={isSigningIn}
                                        onclick={handleProviderSignIn}></lightning-button>
                                </template>
                            </div>
                        </div>
                        <template lwc:if={showXaiCodeInput}>
                            <div class="oauth-connect__extra">
                                <p
                                    class="slds-text-body_small slds-text-color_weak slds-m-bottom_xx-small">
                                    xAI shows a code instead of returning automatically — copy it
                                    and paste it here.
                                </p>
                                <lightning-input
                                    label="Authorization code"
                                    value={pastedCode}
                                    onchange={handlePastedCodeChange}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <lightning-button
                                    label="Submit code"
                                    variant="brand"
                                    data-provider="xai"
                                    disabled={isSigningIn}
                                    onclick={handleSubmitCode}
                                    class="slds-m-top_x-small"></lightning-button>
                            </div>
                        </template>
                        <template lwc:if={xaiNeedsManualModel}>
                            <div class="oauth-connect__extra">
                                <lightning-input
                                    data-provider="xai"
                                    label="Model"
                                    placeholder="e.g. grok-4.1-fast-reasoning"
                                    value={xaiCustomModel}
                                    onchange={handleCustomModelChange}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <p
                                    class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                    No models returned from your SuperGrok subscription — type a
                                    model name to use.
                                </p>
                            </div>
                        </template>
                    </div>
                </slds-tab>
            </slds-tabset>
        </lightning-card>

        <template lwc:if={hideMcpCard}></template>
        <template lwc:else>
            <lightning-card class="settings slds-col slds-size_1-of-1 slds-p-around_medium">
                <div slot="title">
                    <h1>
                        MCP
                        <lightning-badge
                            label="Under development"
                            class="slds-m-left_x-small"></lightning-badge>
                    </h1>
                    <p class="description slds-truncate">
                        Model Context Protocol server configuration.
                    </p>
                </div>
                <div class="slds-grid slds-wrap">
                    <settings-card
                        class="slds-col slds-size_1-of-1 slds-p-horizontal_small"
                        is-first>
                        <div slot="title">
                            <h1>MCP Server Configuration</h1>
                            <p class="description slds-truncate">
                                Configure Model Context Protocol servers for the agent.
                            </p>
                        </div>
                        <slds-information-block>
                            Model Context Protocol server configuration will be available in a
                            future update.
                        </slds-information-block>
                    </settings-card>
                </div>
            </lightning-card>
        </template>

        <lightning-card class="settings slds-col slds-size_1-of-1 slds-p-around_medium">
            <div slot="title">
                <h1>Tools</h1>
                <p class="description slds-truncate">
                    Configure external tools available to the AI agent.
                </p>
            </div>
            <slds-tabset variant="vertical">
                <slds-tab label="Bright Data" value="bright_data">
                    <div class="slds-grid slds-wrap slds-p-around_small">
                        <settings-card
                            is-first
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <div slot="title">
                                <h1>Bright Data</h1>
                                <p class="description slds-truncate">
                                    Real-time web search via Bright Data's SERP API.
                                </p>
                            </div>
                            <div slot="actions">
                                <lightning-input
                                    data-key="tool_bright_data_enabled"
                                    label="Enable for AI agent"
                                    message-toggle-active="Enabled"
                                    message-toggle-inactive="Disabled"
                                    type="toggle"
                                    variant="label-hidden"
                                    checked={config.tool_bright_data_enabled}
                                    onchange={inputfield_change}></lightning-input>
                            </div>
                            <div class="provider-key-row">
                                <lightning-input
                                    data-key="tool_bright_data_key"
                                    label="API Key"
                                    onchange={inputfield_change}
                                    type="password"
                                    value={config.tool_bright_data_key}
                                    variant="label-stacked"
                                    class="slds-full-width"></lightning-input>
                                <div class="provider-key-btn">
                                    <lightning-button-icon
                                        data-key="tool_bright_data_key"
                                        alternative-text="Toggle visibility"
                                        icon-name="utility:preview"
                                        onclick={handleToggleVisibility}></lightning-button-icon>
                                </div>
                            </div>
                        </settings-card>
                    </div>
                </slds-tab>
                <slds-tab label="Google Sheet" value="google_sheet">
                    <div class="slds-grid slds-wrap slds-p-around_small">
                        <settings-card
                            is-first
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <div slot="title">
                                <h1>Google Drive &amp; Sheets</h1>
                                <p class="description slds-truncate">
                                    Read and write Google Sheets and Drive files on your behalf.
                                </p>
                            </div>
                            <div slot="actions">
                                <lightning-input
                                    data-key="tool_google_sheet_enabled"
                                    label="Enable for AI agent"
                                    message-toggle-active="Enabled"
                                    message-toggle-inactive="Disabled"
                                    type="toggle"
                                    variant="label-hidden"
                                    checked={config.tool_google_sheet_enabled}
                                    onchange={inputfield_change}></lightning-input>
                            </div>
                            <div
                                class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                <template lwc:if={googleDriveConnected}>
                                    <lightning-badge
                                        label="Connected"
                                        class="slds-m-right_small google-badge--connected"></lightning-badge>
                                    <lightning-button
                                        label="Revoke Access"
                                        variant="destructive-text"
                                        onclick={handleDisconnectGoogleDrive}></lightning-button>
                                </template>
                                <template lwc:else>
                                    <lightning-button
                                        label="Connect Drive &amp; Sheets"
                                        variant="brand"
                                        disabled={isDriveConnectDisabled}
                                        onclick={handleConnectGoogleDrive}></lightning-button>
                                </template>
                            </div>
                            <template lwc:if={googleDriveConnected}>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    The AI agent can access Google Sheets and Drive files using your
                                    account.
                                </p>
                            </template>
                            <template lwc:else>
                                <slds-information-block>
                                    Requires Google sign-in. Connect your Google account in the User
                                    tab first, then click "Connect Drive &amp; Sheets" to grant
                                    access.
                                </slds-information-block>
                            </template>
                        </settings-card>
                    </div>
                </slds-tab>
            </slds-tabset>
        </lightning-card>
    </div>

    <template lwc:if={useInlineOnboarding}>
        <template lwc:if={showOnboardAiProvider}>
            <section
                class="onboard-modal-backdrop"
                role="dialog"
                aria-label="AI Provider Setup"
                onclick={handleOnboardBackdropClick}>
                <div class="onboard-modal" onclick={handleOnboardModalClick}>
                    <header class="onboard-modal__header">
                        <h2 class="onboard-modal__title">AI Provider Setup</h2>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close setup"
                            title="Close setup"
                            onclick={handleCloseOnboardAiProvider}></lightning-button-icon>
                    </header>
                    <div class="onboard-modal__body">
                        <agent-onboardai-provider
                            onsetupcomplete={handleOnboardAiProviderSetupComplete}></agent-onboardai-provider>
                    </div>
                </div>
            </section>
        </template>
    </template>
    <template lwc:else>
        <slds-vertical-panel
            title="AI Provider Setup"
            position="right"
            size="slds-size_large"
            is-open={showOnboardAiProvider}
            onclose={handleCloseOnboardAiProvider}>
            <agent-onboardai-provider
                onsetupcomplete={handleOnboardAiProviderSetupComplete}></agent-onboardai-provider>
        </slds-vertical-panel>
    </template>
</template>
