<template>
    <div class="onboard-wrap">
        <div class="onboard-card">
            <div class="onboard-header">
                <div class="onboard-header-icon">
                    <lightning-icon
                        icon-name="utility:einstein"
                        size="medium"
                        alternative-text="AI setup"></lightning-icon>
                </div>
                <h1 class="onboard-title">Set up your AI provider</h1>
                <p class="onboard-subtitle">
                    Start by selecting your profile so we can guide you through the right AI setup.
                </p>
            </div>

            <template lwc:if={selectedAudience}>
                <div class="onboard-back">
                    <button type="button" class="onboard-back-btn" onclick={handleResetSelection}>
                        <lightning-icon
                            icon-name="utility:back"
                            size="x-small"
                            alternative-text="Back"></lightning-icon>
                        <span>Choose a different option</span>
                    </button>
                </div>
                <template lwc:if={isEmployeeSelected}>
                    <div class="onboard-section onboard-section--employee">
                        <div class="onboard-section-badge">Salesforce employees</div>
                        <ol class="onboard-steps">
                            <li class="onboard-step">
                                <span class="onboard-step__num">1</span>
                                <span>
                                    Go to&nbsp;
                                    <a
                                        href={employeeSetupUrl}
                                        target="_blank"
                                        rel="noopener noreferrer">
                                        Employee LLM Gateway
                                    </a>
                                    .
                                </span>
                            </li>
                            <li class="onboard-step">
                                <span class="onboard-step__num">2</span>
                                <span>Click Generate Key and paste it below.</span>
                            </li>
                        </ol>
                        <div class="onboard-field">
                            <lightning-input
                                label="Employee LLM key"
                                placeholder="sk-xxxxxx"
                                field-level-help="Keys start with sk- and look like sk-xxxxxx."
                                value={employeeKey}
                                onchange={handleEmployeeKeyChange}
                                pattern="^sk-[A-Za-z0-9]+$"
                                message-when-pattern-mismatch="Key must start with sk- and contain only letters and numbers."
                                type="password"></lightning-input>
                        </div>
                        <template lwc:if={isEmployeeKeyValid}>
                            <div class="onboard-actions">
                                <lightning-button
                                    label="Install key"
                                    variant="brand"
                                    onclick={handleInstallEmployeeKey}></lightning-button>
                            </div>
                        </template>
                    </div>
                </template>
                <template lwc:if={isExternalSelected}>
                    <div class="onboard-section onboard-section--external">
                        <div class="onboard-section-badge onboard-section-badge--external">
                            Customer, partner, etc
                        </div>
                        <p class="onboard-section-desc">
                            Configure your AI provider (OpenAI, Anthropic, Gemini, Mistral, xAI
                            Grok, or the free Workbench tier) in Settings.
                        </p>
                        <div class="onboard-actions">
                            <lightning-button
                                label="Open Settings → AI"
                                variant="brand"
                                icon-name="utility:settings"
                                onclick={handleOpenSettings}></lightning-button>
                        </div>
                    </div>
                </template>
            </template>

            <template lwc:else>
                <div class="onboard-options">
                    <button
                        type="button"
                        class="onboard-choice onboard-choice--employee"
                        onclick={handleSelectEmployee}>
                        <div class="onboard-choice__icon">
                            <lightning-icon
                                icon-name="utility:user"
                                size="small"
                                alternative-text="Salesforce employee"></lightning-icon>
                        </div>
                        <div class="onboard-choice__body">
                            <div class="onboard-choice__title">Salesforce employee</div>
                            <div class="onboard-choice__subtitle">
                                Access the Employee LLM Gateway setup
                            </div>
                        </div>
                        <lightning-icon
                            icon-name="utility:chevronright"
                            size="x-small"
                            alternative-text=""></lightning-icon>
                    </button>

                    <div class="onboard-divider" aria-hidden="true">
                        <span class="onboard-divider__line"></span>
                        <span class="onboard-divider__label">OR</span>
                        <span class="onboard-divider__line"></span>
                    </div>

                    <button
                        type="button"
                        class="onboard-choice onboard-choice--external"
                        onclick={handleSelectExternal}>
                        <div class="onboard-choice__icon">
                            <lightning-icon
                                icon-name="utility:world"
                                size="small"
                                alternative-text="Developer, Administrator, etc"></lightning-icon>
                        </div>
                        <div class="onboard-choice__body">
                            <div class="onboard-choice__title">Developer, Administrator, etc</div>
                            <div class="onboard-choice__subtitle">
                                Configure your AI provider in Settings
                            </div>
                        </div>
                        <lightning-icon
                            icon-name="utility:chevronright"
                            size="x-small"
                            alternative-text=""></lightning-icon>
                    </button>
                </div>
            </template>

            <div class="onboard-safety">
                <lightning-icon
                    icon-name="utility:shield"
                    size="x-small"
                    alternative-text="Safety"></lightning-icon>
                <div class="onboard-safety__content">
                    <span class="onboard-safety__title">AI data safety</span>
                    <span class="onboard-safety__desc">
                        Do not use or share customer data with AI. Only use anonymized or
                        non-sensitive information.
                    </span>
                </div>
            </div>
        </div>
    </div>
</template>
