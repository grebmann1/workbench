<template>
    <div
        class="l-container-vertical"
        onrequestconnection={handleConnectRequest}
        onkeydown={handleShellKeydown}>
        <div lwc:if={connectionError} class="l-cell-content-size slds-p-around_small" role="alert">
            {connectionError}
        </div>
        <div lwc:if={pendingTaskMessage} class="l-cell-content-size slds-p-around_small">
            <span role="status">{pendingTaskMessage}</span>
            <button class="slds-button slds-m-left_small" type="button" onclick={cancelPendingTask}>
                Cancel task
            </button>
        </div>
        <template lwc:if={isAnnouncementBannerDisplayed}>
            <div class="l-cell-content-size">
                <skeleton-announcement-banner></skeleton-announcement-banner>
            </div>
        </template>
        <div class="l-cell-content-size">
            <!-- Logged In User-->
            <template lwc:if={isUserLoggedIn}>
                <slds-notify>
                    <span
                        class="slds-icon_container slds-icon-utility-user slds-m-right_x-small"
                        title="Description of icon when needed">
                        <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                            <use
                                xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#user"></use>
                        </svg>
                    </span>
                    <h2>
                        {loggedInMessage}
                        <template lwc:if={isLogoutDisplayed}>
                            <a href="#" onclick={handleLogoutClick}>Log out</a>
                        </template>
                    </h2>
                </slds-notify>
            </template>
        </div>
        <div class="l-cell-auto-size">
            <div class="l-container-whole-parent">
                <!-- Full App Loading -->
                <template lwc:if={isFullAppLoading}>
                    <skeleton-loading-overlay
                        variant="light"
                        message={fullAppLoadingMessageFormatted}></skeleton-loading-overlay>
                </template>
                <!-- Container & Header -->
                <div class="home l-container-vertical">
                    <!-- Header is replaced by a smaller header in the skeleton-menu to have more HEIGHT -->
                    <template lwc:if={isApplicationTabVisible}>
                        <div class="l-cell-content-size">
                            <skeleton-header
                                managed-layout
                                is-menu-small={layout.menuCollapsed}
                                onmenutoggle={handleMenuToggle}
                                current-application-name="Org"
                                current-tab-name="Home"
                                applications={applications}
                                onnewapp={handleNewApp}
                                ontabchange={handleTabChange}
                                ontabdelete={handleTabDelete}
                                is-user-logged-in={isUserLoggedIn}
                                is-agent-visible={isAgentVisible}
                                is-agent-chat-expanded={isAgentChatExpanded}></skeleton-header>
                        </div>
                    </template>
                    <div lwc:if={showCompactToolbar} class="l-cell-content-size shell-toolbar">
                        <button
                            class="slds-button"
                            type="button"
                            data-shell-toggle="navigation"
                            onclick={handleMenuToggle}>
                            {menuToggleLabel}
                        </button>
                        <button
                            lwc:if={isAgentVisible}
                            class="slds-button"
                            type="button"
                            data-shell-toggle="assistant"
                            onclick={toggleAssistant}>
                            {assistantToggleLabel}
                        </button>
                    </div>
                    <div lwc:ref="workspace" class={workspaceClass}>
                        <!-- Menu -->
                        <div class={menuClass}>
                            <skeleton-menu
                                managed-layout
                                is-menu-small={layout.menuCollapsed}
                                onmenutoggle={handleMenuToggle}
                                class={uiMenuClass}
                                is-user-logged-in={isUserLoggedIn}
                                onapplicationselection={handleApplicationSelection}></skeleton-menu>
                        </div>
                        <!-- Container - START -->
                        <div class="l-cell-auto-size main-app-container">
                            <div class="l-container-vertical">
                                <div
                                    lwc:if={requiresWiderWindow}
                                    class="minimum-width-notice"
                                    role="status">
                                    <h2 class="slds-text-heading_small">
                                        This tool needs a wider window
                                    </h2>
                                    <p>
                                        Resize the window to at least 640 pixels wide. Home and
                                        Connections are available at this size.
                                    </p>
                                </div>
                                <!-- Page - START -->
                                <div class={dynamicAppContainerClass}>
                                    <section class="slds-full-height section">
                                        <div
                                            class="slds-full-height container"
                                            onopenapplication={handleApplicationSelection}>
                                            <!-- [Electron only] SFDX Installation required  -->
                                            <template lwc:if={isSFDXMissing}>
                                                <slds-information-block
                                                    title="Salesforce CLI not found"
                                                    variant="error">
                                                    <p>
                                                        Install the Salesforce CLI for CLI-based
                                                        connections and desktop tools. Quick Connect
                                                        and offline tools are still available.
                                                        <a
                                                            href="https://developer.salesforce.com/tools/salesforcecli">
                                                            https://developer.salesforce.com/tools/salesforcecli
                                                        </a>
                                                    </p>
                                                </slds-information-block>
                                            </template>
                                            <!-- Feature - Start -->
                                            <slds-auth-boundary
                                                is-required={currentApplicationRequiresConnection}
                                                class="slds-full-height">
                                                <template
                                                    for:each={applications}
                                                    for:item="application">
                                                    <div
                                                        key={application.id}
                                                        class={application.classVisibility}>
                                                        <template lwc:if={application.isFullHeight}>
                                                            <lwc:component
                                                                lwc:is={application.constructor}
                                                                lwc:spread={application.attributes}></lwc:component>
                                                        </template>
                                                        <template lwc:else>
                                                            <div
                                                                class="slds-scrollable_y slds-p-around_small">
                                                                <lwc:component
                                                                    lwc:is={application.constructor}
                                                                    lwc:spread={application.attributes}></lwc:component>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </slds-auth-boundary>
                                            <!-- Feature - End -->
                                        </div>
                                    </section>
                                </div>
                                <!-- Page - END -->
                            </div>
                        </div>
                        <!-- Container - END -->
                        <!-- Side Panel container for the Next Gen Agent-->
                        <template lwc:if={isAgentVisible}>
                            <slds-vertical-panel
                                class="assistant-pane"
                                size={assistantPanelSize}
                                max-width={assistantPanelMaxWidth}
                                disable-resize={isAssistantResizeDisabled}
                                title="Next Gen Agent"
                                position="right"
                                is-open={isAgentChatExpanded}
                                is-header-hidden>
                                <!-- Agent App -->
                                <div class="assistant-surface">
                                    <div lwc:if={layout.assistantFocused} class="assistant-return">
                                        <button
                                            type="button"
                                            class="slds-button"
                                            data-return-to-tool
                                            onclick={closeAssistant}>
                                            Back to tool
                                        </button>
                                    </div>
                                    <agent-app
                                        assistant-style
                                        assistant-theme="workbench"
                                        class="assistant-content slds-flex-column"
                                        onopensettings={handleOpenAiSettings}></agent-app>
                                </div>
                            </slds-vertical-panel>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- Shared Footer -->
        <template lwc:if={isUserLoggedIn}>
            <skeleton-footer version={version}></skeleton-footer>
        </template>

        <!-- Electron -->
        <template lwc:if={isElectronApp}>
            <core-electron></core-electron>
        </template>
    </div>
</template>
