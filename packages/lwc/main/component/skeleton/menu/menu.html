<template>
    <template lwc:if={isHeaderLightDisplayed}>
        <header>
            <!-- Navigation -->
            <div class="slds-context-bar slds-inner-menu-header">
                <div class="slds-context-bar__primary">
                    <div
                        class="slds-context-bar__item slds-context-bar__dropdown-trigger slds-dropdown-trigger slds-dropdown-trigger_click slds-no-hover"
                        style="display: flex; align-items: center">
                        <div class={collapseClass}>
                            <lightning-button-icon
                                icon-name={iconName}
                                alternative-text={toggleLabel}
                                title={toggleLabel}
                                variant="bare"
                                size="large"
                                onclick={handleToggle}></lightning-button-icon>
                        </div>
                        <template lwc:if={isTitleDisplayed}>
                            <span
                                class="slds-p-left_x-small slds-context-bar__label-action slds-context-bar__app-name">
                                <span class="slds-truncate" title="Workbench">Workbench</span>
                            </span>
                        </template>
                    </div>
                </div>
            </div>
        </header>
    </template>
    <template lwc:if={isNotMenuSmall}>
        <div class="explorer-search" onkeydown={handleSearchKeydown}>
            <lightning-input
                lwc:ref="search"
                type="search"
                label="Search tools and pages"
                placeholder="Search tools and pages…"
                value={filterText}
                onchange={handleSearchInput}
                variant="label-hidden"
                class="explorer-search-input"></lightning-input>
            <template lwc:if={hasSearchText}>
                <p class="search-summary" role="status">{searchSummary}</p>
                <template lwc:if={hasNoSearchResults}>
                    <p class="search-hint">Try a tool name or a task, such as “compare”.</p>
                    <button type="button" class="slds-button" onclick={handleClearSearch}>
                        Clear search
                    </button>
                </template>
            </template>
        </div>
    </template>
    <slds-vertical-navigation
        class="menu-header"
        selected-item-name={selectedItemName}
        sections={sections}
        is-collapsed={isMenuSmall}
        onselect={handleSelect}
        oncollapse={handleCollapse}></slds-vertical-navigation>
</template>
