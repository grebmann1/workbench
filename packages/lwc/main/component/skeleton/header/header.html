<template>
    <header class="slds-global-header_container">
        <!-- Navigation -->
        <div class="slds-context-bar">
            <div class="slds-context-bar__primary">
                <div
                    class="slds-context-bar__item slds-context-bar__dropdown-trigger slds-dropdown-trigger slds-dropdown-trigger_click slds-no-hover">
                    <div class={collapseClass}>
                        <lightning-button-icon
                            icon-name={leftPanelIconName}
                            data-toggle="navigation"
                            alternative-text={leftPanelLabel}
                            title={leftPanelLabel}
                            variant="bare"
                            size="large"
                            onclick={handleToggle}></lightning-button-icon>
                    </div>
                    <span class="slds-context-bar__label-action slds-context-bar__app-name">
                        <span class="slds-truncate" title="Workbench">Workbench</span>
                    </span>
                    <span class="beta-badge" title="Beta">Beta</span>
                </div>
            </div>
            <nav class="slds-context-bar__secondary" aria-label="Open applications">
                <ul class="slds-grid">
                    <li class="slds-context-bar__item">
                        <button
                            type="button"
                            class="slds-button tab-select"
                            data-path="home"
                            aria-current={homeCurrent}
                            onclick={selectTab}
                            onfocus={handleTabFocus}>
                            Home
                        </button>
                    </li>
                    <template for:each={visibleApplications} for:item="application">
                        <li key={application.id} class={application.class}>
                            <button
                                type="button"
                                class="slds-button tab-select"
                                data-path={application.path}
                                onclick={selectTab}
                                aria-current={application.ariaCurrent}
                                onfocus={handleTabFocus}
                                title={application.label}>
                                <span class="slds-truncate" title={application.label}>
                                    {application.label}
                                </span>
                            </button>
                            <template lwc:if={application.isDeletable}>
                                <button
                                    type="button"
                                    class="slds-button tab-close"
                                    onclick={deleteTab}
                                    data-key={application.id}
                                    aria-label={application.closeLabel}
                                    title={application.closeLabel}>
                                    <lightning-icon
                                        icon-name="utility:close"
                                        size="xx-small"></lightning-icon>
                                </button>
                            </template>
                        </li>
                    </template>
                </ul>
            </nav>
            <template lwc:if={isAgentVisible}>
                <div class="slds-context-bar__primary right-panel-collapse">
                    <div
                        class="slds-context-bar__item slds-context-bar__dropdown-trigger slds-dropdown-trigger slds-dropdown-trigger_click slds-no-hover">
                        <div class={rightPanelCollapseClass}>
                            <lightning-button-icon
                                icon-name={rightPanelIconName}
                                data-toggle="assistant"
                                alternative-text={rightPanelLabel}
                                title={rightPanelLabel}
                                variant="bare"
                                size="large"
                                onclick={handleToggle_rightPanel}></lightning-button-icon>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </header>
</template>
