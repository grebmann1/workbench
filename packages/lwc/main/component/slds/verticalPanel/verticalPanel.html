<template>
    <div class="slds-filter-panel-container">
        <div lwc:ref="panel" class={filterPanelClass} style={panelStyle}>
            <div
                lwc:if={showResizeHandle}
                class="vertical-panel-drag-handle"
                role="separator"
                tabindex="0"
                aria-label={resizeLabel}
                aria-orientation="vertical"
                aria-valuemin={effectiveMinWidth}
                aria-valuemax={normalizedMaxWidth}
                aria-valuenow={resizeValue}
                aria-valuetext={resizeValueText}
                onpointerdown={handleResizeStart}
                onpointermove={handleResizeMove}
                onpointerup={finishResize}
                onpointercancel={finishResize}
                onlostpointercapture={finishResize}
                onkeydown={handleResizeKeydown}></div>
            <div class="slds-panel__header" lwc:if={isHeaderVisible}>
                <h2
                    class="slds-panel__header-title slds-text-heading_small slds-truncate"
                    title={title}>
                    {title}
                </h2>
                <div class="slds-panel__header-actions">
                    <slot name="actions"></slot>
                    <lightning-button-icon
                        class="slds-panel__close"
                        icon-name="utility:close"
                        onclick={handleClose}
                        alternative-text="Close panel"
                        title="Close panel"></lightning-button-icon>
                </div>
            </div>
            <div class="slds-panel__body slds-fill-height">
                <slot></slot>
            </div>
        </div>
    </div>
</template>
