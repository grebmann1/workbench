<template>
    <div class="sftk-editor" onkeydown={handleKeyDown}>
        <template lwc:if={isText}>
            <lightning-input
                variant="label-hidden"
                label={fieldLabel}
                type="text"
                value={_draft}
                max-length={maxLengthAttr}
                onchange={handleChange}
                onblur={handleBlur}></lightning-input>
        </template>
        <template lwc:elseif={isTextarea}>
            <lightning-textarea
                variant="label-hidden"
                label={fieldLabel}
                value={_draft}
                max-length={maxLengthAttr}
                onchange={handleChange}
                onblur={handleBlur}></lightning-textarea>
        </template>
        <template lwc:elseif={isNumber}>
            <lightning-input
                variant="label-hidden"
                label={fieldLabel}
                type="number"
                value={_draft}
                step="any"
                onchange={handleChange}
                onblur={handleBlur}></lightning-input>
        </template>
        <template lwc:elseif={isDate}>
            <lightning-input
                variant="label-hidden"
                label={fieldLabel}
                type="date"
                value={_draft}
                onchange={handleChange}
                onblur={handleBlur}></lightning-input>
        </template>
        <template lwc:elseif={isDatetime}>
            <lightning-input
                variant="label-hidden"
                label={fieldLabel}
                type="datetime"
                value={_draft}
                onchange={handleChange}
                onblur={handleBlur}></lightning-input>
        </template>
        <template lwc:elseif={isBoolean}>
            <lightning-input
                variant="label-hidden"
                label={fieldLabel}
                type="checkbox"
                checked={_draft}
                onchange={handleChange}></lightning-input>
        </template>
        <template lwc:elseif={isPicklist}>
            <lightning-combobox
                variant="label-hidden"
                label={fieldLabel}
                value={_draft}
                options={picklistValues}
                onchange={handleChange}
                onblur={handleBlur}></lightning-combobox>
        </template>
        <template lwc:elseif={isMultipicklist}>
            <lightning-dual-listbox
                variant="label-hidden"
                label={fieldLabel}
                source-label="Available"
                selected-label="Selected"
                value={_draft}
                options={picklistValues}
                onchange={handleChange}
                onblur={handleBlur}></lightning-dual-listbox>
        </template>
    </div>
</template>
