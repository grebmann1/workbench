<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Workbench — Signed in</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f4f6f9;
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
            }
            .card {
                background: #ffffff;
                border: 1px solid #e5e5e5;
                border-radius: 12px;
                padding: 40px 48px;
                text-align: center;
                max-width: 380px;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            }
            .check {
                width: 56px;
                height: 56px;
                line-height: 56px;
                margin: 0 auto 20px;
                border-radius: 50%;
                background: #2e844a;
                color: #ffffff;
                font-size: 30px;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 18px;
                font-weight: 600;
                color: #181818;
            }
            p {
                margin: 0;
                font-size: 14px;
                line-height: 1.5;
                color: #444444;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="check">✓</div>
            <h1>Signed in to Workbench</h1>
            <p>You can close this tab and return to Workbench.</p>
        </div>
    </body>
</html>
